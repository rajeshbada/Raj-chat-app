apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat-app-ingress
  namespace: chat-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: chatapp.example.com
      http:
        paths:
        - pathType: Prefix
          path: /
          backend:
             service:
                name: frontend
                port:
                  number: 80  
        - pathType: Prefix
          path: "/api"
          backend:
            service:
              name: backend
              port:
                number: 5001 